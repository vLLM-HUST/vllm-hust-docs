servingEngineSpec:
  enableEngine: false

routerSpec:
  enableRouter: true
  repository: vllmhust/production-stack-rollout-probe
  tag: controller-hpa
  imagePullPolicy: IfNotPresent
  serviceDiscovery: static
  staticBackends: http://127.0.0.1:18000
  staticModels: rollout-probe
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 50
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
    failureThreshold: 30
    httpGet:
      path: /health
      port: 8000
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
    failureThreshold: 3
    httpGet:
      path: /health
      port: 8000
  livenessProbe:
    initialDelaySeconds: 0
    periodSeconds: 2
    failureThreshold: 3
    httpGet:
      path: /health
      port: 8000

loraController:
  enableLoraController: true
  replicaCount: 1
  image:
    repository: vllmhust/production-stack-rollout-probe
    tag: controller-hpa
    pullPolicy: IfNotPresent
  metrics:
    enabled: false
  webhook:
    enabled: false
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 32Mi

kube-prometheus-stack:
  enabled: false

prometheus-adapter:
  enabled: false
